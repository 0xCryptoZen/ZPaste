name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode version
        run: xcodebuild -version

      - name: Test clipboard policies
        run: bash scripts/test-policies.sh

      - name: Test history presentation
        run: bash scripts/test-presentation.sh

      - name: Test history storage
        run: bash scripts/test-storage.sh

      - name: Build (no signing)
        run: |
          xcodebuild -project ZPaste.xcodeproj \
            -scheme ZPaste \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ZPaste-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ZPaste-build/Build/Products/Debug/ZPaste.app" \
            "$RUNNER_TEMP/ZPaste-macOS.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ZPaste-macOS
          path: ${{ runner.temp }}/ZPaste-macOS.zip
          if-no-files-found: error
          retention-days: 14
