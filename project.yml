name: PasteClone
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
targets:
  PasteClone:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "*.entitlements"
          - "project.yml"
          - "Info.plist"
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pasteclone
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
