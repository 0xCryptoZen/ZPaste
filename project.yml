name: ZPaste
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
targets:
  ZPaste:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "*.entitlements"
          - "project.yml"
          - "Info.plist"
          - "README.md"
          - ".git"
          - ".github"
          - "Tests"
          - "scripts"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zpaste
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: ZPaste.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  ZPaste:
    build:
      targets:
        ZPaste: all
    run:
      config: Debug
