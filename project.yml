name: ZPaste
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
targets:
  ZPaste:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - "*.entitlements"
          - "project.yml"
          - "Info.plist"
          - "README.md"
          - ".github"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zpaste
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets: []
schemes:
  ZPaste:
    build:
      targets:
        ZPaste: all
    run:
      config: Debug